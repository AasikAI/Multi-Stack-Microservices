<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Stack Microservices Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>Multi-Stack Microservices Dashboard</h1>
    </div>
  </header>

  <main class="container">
    <nav class="tabs">
      <button class="tab-button active" data-tab="users">Users</button>
      <button class="tab-button" data-tab="products">Products</button>
      <button class="tab-button" data-tab="orders">Orders</button>
    </nav>

    <!-- Users Panel -->
    <section id="users-panel" class="tab-panel active">
      <div class="card">
        <h2>Create User</h2>
        <form id="create-user-form" class="form">
          <div class="form-row">
            <div class="form-group">
              <label for="user-name">Name</label>
              <input type="text" id="user-name" name="name" placeholder="Full name" required>
            </div>
            <div class="form-group">
              <label for="user-email">Email</label>
              <input type="email" id="user-email" name="email" placeholder="email@example.com" required>
            </div>
            <div class="form-group form-action">
              <button type="submit" class="btn btn-primary">Create User</button>
            </div>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Users</h2>
        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Created At</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <tr><td colspan="5" class="loading-cell">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Products Panel -->
    <section id="products-panel" class="tab-panel">
      <div class="card">
        <h2>Create Product</h2>
        <form id="create-product-form" class="form">
          <div class="form-row">
            <div class="form-group">
              <label for="product-name">Name</label>
              <input type="text" id="product-name" name="name" placeholder="Product name" required>
            </div>
            <div class="form-group">
              <label for="product-description">Description</label>
              <input type="text" id="product-description" name="description" placeholder="Product description" required>
            </div>
            <div class="form-group">
              <label for="product-price">Price</label>
              <input type="number" id="product-price" name="price" placeholder="0.00" step="0.01" min="0" required>
            </div>
            <div class="form-group">
              <label for="product-category">Category</label>
              <input type="text" id="product-category" name="category" placeholder="Category" required>
            </div>
            <div class="form-group form-action">
              <button type="submit" class="btn btn-primary">Create Product</button>
            </div>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Products</h2>
        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Category</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="products-table-body">
              <tr><td colspan="6" class="loading-cell">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Orders Panel -->
    <section id="orders-panel" class="tab-panel">
      <div class="card">
        <h2>Create Order</h2>
        <form id="create-order-form" class="form">
          <div class="form-row">
            <div class="form-group">
              <label for="order-user-id">User</label>
              <select id="order-user-id" name="userId" required>
                <option value="">Select a user...</option>
              </select>
            </div>
            <div class="form-group">
              <label for="order-product-id">Product</label>
              <select id="order-product-id" name="productId" required>
                <option value="">Select a product...</option>
              </select>
            </div>
            <div class="form-group">
              <label for="order-quantity">Quantity</label>
              <input type="number" id="order-quantity" name="quantity" placeholder="1" min="1" value="1" required>
            </div>
            <div class="form-group form-action">
              <button type="submit" class="btn btn-primary">Create Order</button>
            </div>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Orders</h2>
        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>User ID</th>
                <th>Product ID</th>
                <th>Quantity</th>
                <th>Total Price</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="orders-table-body">
              <tr><td colspan="8" class="loading-cell">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="notification-area"></div>

  <script src="js/app.js"></script>
  <script src="js/users.js"></script>
  <script src="js/products.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
